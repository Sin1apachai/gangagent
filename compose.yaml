name: agent-office
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: office
      POSTGRES_USER: office
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U office -d office"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "no", --save, "", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    image: agent-office-local:latest
    build: {context: ., target: runtime}
    ports: ["127.0.0.1:${OFFICE_PORT:-8088}:8080"]
    environment:
      DATABASE_URL: postgres://office:${POSTGRES_PASSWORD}@postgres:5432/office
      REDIS_URL: redis://redis:6379
      OWNER_EMAIL: ${OWNER_EMAIL:?Run setup first}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Run setup first}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      EMBEDDING_ADDR: embeddings:8090
    volumes: [runs-data:/data:ro]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    init: true
  worker:
    image: agent-office-worker:latest
    build: {context: ., target: worker}
    user: "0:0"
    command: [/app/agent-office, --worker]
    environment:
      DATABASE_URL: postgres://office:${POSTGRES_PASSWORD}@postgres:5432/office
      OWNER_EMAIL: ${OWNER_EMAIL}
      WORKER_ID: local-worker
      REDIS_URL: redis://redis:6379
    volumes:
      - runs-data:/data
      - codex-auth:/home/office/.codex
      - claude-auth:/home/office/.claude
    depends_on:
      app: {condition: service_started}
      postgres: {condition: service_healthy}
    restart: unless-stopped
    init: true
    pids_limit: 256
    mem_limit: 2g
  codex-login:
    image: agent-office-worker:latest
    profiles: [auth]
    user: "10001:10001"
    working_dir: /home/office
    volumes: [codex-auth:/home/office/.codex]
    stdin_open: true
    tty: true
    entrypoint: [codex]
    command: [login, --device-auth, -c, 'cli_auth_credentials_store="file"', -c, 'forced_login_method="chatgpt"']
  claude-login:
    image: agent-office-worker:latest
    profiles: [auth]
    user: "10001:10001"
    working_dir: /home/office
    volumes: [claude-auth:/home/office/.claude]
    stdin_open: true
    tty: true
    entrypoint: [claude]
    command: [auth, login]
  tests:
    image: python:3.13-alpine
    profiles: [test]
    volumes: [./tests:/tests:ro]
    working_dir: /tests
    environment:
      BASE_URL: http://app:8080
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
    depends_on:
      app: {condition: service_started}
    command: [python, -m, unittest, discover, -v]
  web-tools:
    image: node:22-bookworm-slim
    profiles: [tools]
    working_dir: /web
    volumes: [./web:/web]
    command: [npx, --yes, prettier@3.6.2, --write, src, tsconfig.json, package.json]
  rust-tools:
    image: rust:1.92-bookworm
    profiles: [tools]
    working_dir: /server
    volumes: [./server:/server]
    command: [sh, -c, "rustup component add rustfmt && cargo fmt --all"]
  embeddings:
    image: agent-office-embeddings:local
    build: {context: ./semantic}
    profiles: [semantic]
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8090/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  runs-data:
  codex-auth:
  claude-auth:
  postgres-data:
  redis-data:
