# Separate project and ephemeral databases. Never points tests at the working office.
services:
  app:
    image: agent-office-local:latest
    ports: !reset []
    environment:
      DATABASE_URL: postgres://office:${POSTGRES_PASSWORD}@postgres:5432/office_test
      EMBEDDING_ADDR: ""
      PROJECT_BRIDGE_ADDR: project-bridge:18089
      PROJECT_BRIDGE_TOKEN: fixture-project-bridge-token-12345
    restart: "no"
  backup:
    environment:
      PGDATABASE: office_test
      DATABASE_URL: postgres://office:${POSTGRES_PASSWORD}@postgres:5432/office_test
    restart: "no"
  postgres:
    environment:
      POSTGRES_DB: office_test
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U office -d office_test"]
    volumes: !reset []
    tmpfs: [/var/lib/postgresql/data]
    restart: "no"
  redis:
    volumes: !reset []
    tmpfs: [/data]
    restart: "no"
  worker:
    image: agent-office-local:latest
    build: !reset null
    environment:
      DATABASE_URL: postgres://office:${POSTGRES_PASSWORD}@postgres:5432/office_test
      PROJECT_BRIDGE_ADDR: project-bridge:18089
      PROJECT_BRIDGE_TOKEN: fixture-project-bridge-token-12345
      WORKER_MODE: fixture
      ALLOW_TEST_WORKER: "1"
    volumes: !override [runs-data:/data]
    restart: "no"
  tests:
    depends_on:
      backup: {condition: service_started}
      worker: {condition: service_started}
      worker-two: {condition: service_started}
      project-bridge: {condition: service_started}
  worker-two:
    image: agent-office-local:latest
    user: "0:0"
    command: [/app/agent-office, --worker]
    environment:
      DATABASE_URL: postgres://office:${POSTGRES_PASSWORD}@postgres:5432/office_test
      OWNER_EMAIL: ${OWNER_EMAIL}
      WORKER_ID: test-worker-two
      PROJECT_BRIDGE_ADDR: project-bridge:18089
      PROJECT_BRIDGE_TOKEN: fixture-project-bridge-token-12345
      WORKER_MODE: fixture
      ALLOW_TEST_WORKER: "1"
    volumes: [runs-data:/data]
    depends_on:
      app: {condition: service_started}
      postgres: {condition: service_healthy}
    restart: "no"

  project-bridge:
    image: python:3.13-alpine
    command: [python, /tools/project_bridge.py]
    environment:
      OFFICE_BRIDGE_FIXTURE: "1"
      ALLOW_TEST_WORKER: "1"
      PROJECT_BRIDGE_TOKEN: fixture-project-bridge-token-12345
      OFFICE_BRIDGE_STATE: /tmp/bridge-test
    volumes: [./tools:/tools:ro]
    restart: "no"
